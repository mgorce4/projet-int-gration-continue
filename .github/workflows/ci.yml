name: CI/CD Pipeline

# Déclenchement : à chaque push sur les branches principales, à chaque pull
# request vers main, et manuellement depuis l'onglet Actions (workflow_dispatch)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Annule automatiquement l'exécution précédente si un nouveau push arrive sur
# la même branche pendant qu'un run est encore en cours (évite de gaspiller
# des minutes CI sur du code déjà obsolète)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions minimales par défaut (lecture seule) ; chaque job qui a besoin
# d'écrire (commentaire de couverture sur une PR, upload SARIF) déclare
# explicitement ce dont il a besoin dans son propre bloc "permissions".
permissions:
  contents: read

jobs:

  # ---------------------------------------------------------------------
  # 1. Compilation + tests unitaires backend (Java / Spring Boot / Maven)
  # ---------------------------------------------------------------------
  backend-tests:
    name: Backend - Build & Tests unitaires
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compilation et exécution des tests (JUnit 5 + JaCoCo)
        working-directory: backend
        run: mvn -B test

      - name: Publication des résultats de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      # Les classes compilées et le rapport JaCoCo sont réutilisés par le job
      # SonarCloud plus bas, pour éviter de recompiler deux fois le backend.
      - name: Publication des classes et du rapport de couverture
        uses: actions/upload-artifact@v7
        with:
          name: backend-build-output
          path: |
            backend/target/classes
            backend/target/test-classes
            backend/target/site/jacoco
          retention-days: 1

      # Retour de couverture backend : commente la pull request avec le
      # pourcentage de lignes/branches couvertes, ligne par ligne sur les
      # fichiers modifiés. Ne s'exécute que sur les PR (rien à commenter
      # sur un simple push sur main) ; le détail complet reste consultable
      # dans le rapport JaCoCo (artefact) et sur le dashboard SonarCloud.
      - name: Retour de couverture sur la pull request (JaCoCo)
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: backend/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: 'Couverture de code - Backend (JaCoCo)'
          update-comment: true

  # ---------------------------------------------------------------------
  # 2. Convention de codage backend (Checkstyle)
  # ---------------------------------------------------------------------
  backend-checkstyle:
    name: Backend - Convention de style (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # failsOnError=false dans le pom : ce job remonte les violations sans
      # bloquer la pipeline (voir justification dans le rapport)
      - name: Analyse Checkstyle (règles Google)
        working-directory: backend
        run: mvn -B checkstyle:check

      - name: Publication du rapport Checkstyle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-checkstyle-report
          path: backend/target/checkstyle-result.xml
          retention-days: 7

  # ---------------------------------------------------------------------
  # 3. Build + tests unitaires frontend (Vue 3 / Vitest)
  # ---------------------------------------------------------------------
  frontend-tests:
    name: Frontend - Build & Tests unitaires
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Installation Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        working-directory: frontend
        run: npm ci

      - name: Exécution des tests unitaires (Vitest) avec couverture
        working-directory: frontend
        run: npm run test:coverage

      - name: Vérification du build de production (Vite)
        working-directory: frontend
        run: npm run build

      - name: Publication du rapport de couverture
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 1

      # Retour de couverture frontend : équivalent du step JaCoCo côté
      # backend, mais pour Vitest. Nécessite les reporters 'json-summary' et
      # 'json' déclarés dans vite.config.js (bloc test.coverage.reporter).
      - name: Retour de couverture sur la pull request (Vitest)
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: frontend/coverage/coverage-summary.json
          json-final-path: frontend/coverage/coverage-final.json

  # ---------------------------------------------------------------------
  # 4. Analyse statique frontend (ESLint) - reporting, non bloquant
  # ---------------------------------------------------------------------
  frontend-lint:
    name: Frontend - Analyse statique (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - working-directory: frontend
        run: npm ci

      # continue-on-error : le lint est encore en phase de mise en place sur
      # ce projet existant, il ne doit pas casser la pipeline pour l'instant
      - name: Lint ESLint
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

  # ---------------------------------------------------------------------
  # 5. Analyse statique combinée + qualité de code (SonarCloud)
  # ---------------------------------------------------------------------
  sonarcloud:
    name: Analyse SonarCloud (SAST)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Récupération du code (historique complet requis par Sonar)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Récupération des classes backend + rapport JaCoCo
        uses: actions/download-artifact@v4
        with:
          name: backend-build-output
          path: backend/target

      - name: Récupération de la couverture frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Analyse SonarCloud
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Contrairement à Checkstyle et Trivy (volontairement en mode rapport),
      # le Quality Gate SonarCloud est ici bloquant : si le code ne respecte
      # pas les seuils définis (bugs, vulnérabilités, duplication, couverture
      # minimale...), ce step échoue et fait échouer toute la pipeline.
      - name: Vérification du Quality Gate (bloquant)
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------------------------------------------------------------------
  # 6. Vérification des dépendances / scan de vulnérabilités (Trivy)
  # ---------------------------------------------------------------------
  dependency-scan:
    name: Vérification des dépendances (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # scan-type "fs" : analyse le pom.xml et le package-lock.json à la
      # recherche de CVE connues sur les dépendances utilisées.
      # exit-code 0 = rapport informatif, n'échoue pas la pipeline pour
      # l'instant (voir discussion dans le rapport sur le passage en mode
      # bloquant une fois les vulnérabilités existantes traitées).
      - name: Scan de vulnérabilités des dépendances
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Publication du rapport dans l'onglet Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # ---------------------------------------------------------------------
  # 7. Packaging : validation des images Docker (backend + frontend)
  # ---------------------------------------------------------------------
  docker-build:
    name: Packaging - Build des images Docker
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, backend-checkstyle]
    steps:
      - uses: actions/checkout@v4

      - name: Configuration Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: tictactoe-backend:ci

      - name: Build image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: tictactoe-frontend:ci
