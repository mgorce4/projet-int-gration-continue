# Configuration SonarCloud pour le monorepo (backend Spring Boot + frontend Vue 3)
#
# sonar.projectKey et sonar.organization sont propres à votre compte SonarCloud :
# remplacez les valeurs ci-dessous par celles affichées lors de la création du
# projet sur https://sonarcloud.io (bouton "+" > Analyze new project).

sonar.projectKey=VOTRE_LOGIN_tictactoe-morpion
sonar.organization=VOTRE_LOGIN

sonar.projectName=Morpion Vue 3 & Spring Boot
sonar.sourceEncoding=UTF-8

# Code source analysé : le Java du backend et le JS/Vue du frontend
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src/components/__tests__

# Bytecode Java nécessaire à l'analyse (généré par "mvn test" avant le scan)
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# Rapports de couverture produits par les jobs de test de la CI
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.exclusions=**/node_modules/**,**/target/**,**/dist/**,**/*.spec.js
